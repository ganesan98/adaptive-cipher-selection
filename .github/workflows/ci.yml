name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake g++
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python tests/integration.py --build build -v
      - name: Retrain and verify exported model
        run: |
          python python/train.py --out build/retrained
          ./build/policy_test build/retrained/policy.tree build/retrained/parity.csv
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results
          path: build/Testing/Temporary/LastTest.log
